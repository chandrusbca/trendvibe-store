<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrendVibe Store</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: #faf5ff; padding: 10px; margin: 0; text-align: center; }
  header { background: #7e22ce; color: white; padding: 10px; border-radius: 6px; }
  .card { background: white; border: 1px solid #ccc; margin: 12px auto; padding: 10px; max-width: 260px; border-radius: 8px; }
  .card img { width: 100%; height: 140px; object-fit: cover; border-radius: 6px; }
  .card h4 { margin: 8px 0 4px; font-size: 16px; color: #333; }
  .card p { margin: 4px 0 8px; font-weight: bold; color: #555; }
  button { background: #9333ea; color: white; border: none; padding: 8px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; width: 100%; }
  .cart-box { background: white; border: 2px solid #7e22ce; margin: 15px auto; padding: 12px; max-width: 260px; border-radius: 8px; }
  .buy-btn { background: #16a34a; margin-top: 8px; }
</style>
</head>
<body>
 
  <header>
    <h3 style="margin:0;">TrendVibe Fashion</h3>
  </header>
 
  <div class="card">
    <img src="https://images.unsplash.com/photo-1576995853123-5a10305d93c0?w=300" alt="Denim Jacket">
    <h4>Denim Jacket</h4>
    <p>Price: &#8377;1500</p>
    <button onclick="add(1500)">Add to Bag</button>
  </div>
 
  <div class="card">
    <img src="https://images.unsplash.com/photo-1549298916-b41d501d3772?w=300" alt="White Sneakers">
    <h4>White Sneakers</h4>
    <p>Price: &#8377;2000</p>
    <button onclick="add(2000)">Add to Bag</button>
  </div>
 
  <div class="card">
    <img src="https://images.unsplash.com/photo-1524805444758-089113d48a6d?w=300" alt="Leather Watch">
    <h4>Leather Watch</h4>
    <p>Price: &#8377;1000</p>
    <button onclick="add(1000)">Add to Bag</button>
  </div>
 
  <div class="cart-box">
    <h4 style="margin:0 0 8px;">Shopping Bag</h4>
    <p style="margin:4px 0;">Items: <b id="count">0</b></p>
    <p style="margin:4px 0;">Total: &#8377;<b id="total">0</b></p>
    <button class="buy-btn" onclick="buy()">Buy Now</button>
  </div>
 
<script>
  var total = 0;
  var count = 0;
 
  function add(price) {
    count = count + 1;
    total = total + price;
    document.getElementById("count").innerText = count;
    document.getElementById("total").innerText = total;
  }
 
  function buy() {
    if (total === 0) {
      alert("Bag is empty! Please add items to your cart first.");
    } else {
      alert("Order Placed Successfully!\nTotal Items: " + count + "\nTotal Amount: Rs. " + total);
    }
  }
</script>
 
</body>
</html>
